components:
  schemas:
    AnswerBody:
      additionalProperties: false
      properties:
        label:
          type: string
        type:
          type: string
        value:
          description: "valor normalizado como texto (number: \"42\", checkbox: \"true\")"
          type: string
      required:
        - label
        - type
        - value
      type: object
    ConfigOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfigOutputBody.json
          format: uri
          readOnly: true
          type: string
        googleAuth:
          description: true quando o login com Google está configurado
          type: boolean
      required:
        - googleAuth
      type: object
    CredentialsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CredentialsInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: e-mail do admin
          format: email
          type: string
        password:
          description: senha (mín. 8 caracteres)
          maxLength: 72
          minLength: 8
          type: string
      required:
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FieldBody:
      additionalProperties: false
      properties:
        id:
          format: int64
          readOnly: true
          type: integer
        label:
          maxLength: 200
          minLength: 1
          type: string
        options:
          description: obrigatório (e só usado) quando type=select
          items:
            type: string
          type: array
        required:
          type: boolean
        type:
          enum:
            - text
            - number
            - select
            - checkbox
          type: string
      required:
        - label
        - type
        - required
      type: object
    FormBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormBody.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/FieldBody"
          type: array
        id:
          format: int64
          type: integer
        publicPath:
          description: "caminho público, ex: /f/meu-form-ab12cd34"
          type: string
        publishedAt:
          format: date-time
          type: string
        slug:
          description: preenchido quando publicado
          type: string
        status:
          enum:
            - draft
            - published
          type: string
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - description
        - status
        - fields
        - createdAt
        - updatedAt
      type: object
    FormInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          maxLength: 2000
          type: string
        fields:
          description: definição completa dos campos, na ordem de exibição
          items:
            $ref: "#/components/schemas/FieldBody"
          type: array
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - fields
      type: object
    FormListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormListOutputBody.json
          format: uri
          readOnly: true
          type: string
        forms:
          items:
            $ref: "#/components/schemas/FormBody"
          type: array
      required:
        - forms
      type: object
    FormUpdateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormUpdateInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          maxLength: 2000
          type: string
        fields:
          items:
            $ref: "#/components/schemas/FieldBody"
          type: array
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - fields
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        database:
          description: ok se o ping no Postgres respondeu
          examples:
            - ok
          type: string
        status:
          description: ok quando a API está de pé
          examples:
            - ok
          type: string
      required:
        - status
        - database
      type: object
    PublicFieldBody:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        label:
          type: string
        options:
          items:
            type: string
          type: array
        required:
          type: boolean
        type:
          enum:
            - text
            - number
            - select
            - checkbox
          type: string
      required:
        - id
        - label
        - type
        - required
      type: object
    PublicFormBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PublicFormBody.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/PublicFieldBody"
          type: array
        slug:
          type: string
        title:
          type: string
      required:
        - slug
        - title
        - description
        - fields
      type: object
    ResponseBody:
      additionalProperties: false
      properties:
        answers:
          items:
            $ref: "#/components/schemas/AnswerBody"
          type: array
        createdAt:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
        - createdAt
        - answers
      type: object
    ResponseListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ResponseListOutputBody.json
          format: uri
          readOnly: true
          type: string
        formId:
          format: int64
          type: integer
        responses:
          items:
            $ref: "#/components/schemas/ResponseBody"
          type: array
        total:
          format: int64
          type: integer
      required:
        - formId
        - total
        - responses
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SessionOutputBody.json
          format: uri
          readOnly: true
          type: string
        expiresAt:
          format: date-time
          type: string
        token:
          description: "JWT a enviar em Authorization: Bearer <token>"
          type: string
        user:
          $ref: "#/components/schemas/UserBody"
      required:
        - token
        - expiresAt
        - user
      type: object
    SubmitInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitInputBody.json
          format: uri
          readOnly: true
          type: string
        answers:
          additionalProperties: {}
          description: mapa de id do campo para o valor respondido
          type: object
      required:
        - answers
      type: object
    SubmitOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubmitOutputBody.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        message:
          type: string
      required:
        - id
        - createdAt
        - message
      type: object
    UserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserBody.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
        - email
        - createdAt
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Form Builder API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/google:
    get:
      description: Redireciona (302) para a tela de consentimento do Google. Responde 503 quando as credenciais do Google não estão configuradas.
      operationId: googleLogin
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Inicia o login com Google
      tags:
        - auth
  /auth/google/callback:
    get:
      description: "Redireciona (302) para o frontend com o token no fragmento da URL (#token=...). Em caso de erro, redireciona com #error=..."
      operationId: googleCallback
      parameters:
        - description: código de autorização devolvido pelo Google
          explode: false
          in: query
          name: code
          schema:
            description: código de autorização devolvido pelo Google
            type: string
        - description: deve bater com o state guardado no cookie
          explode: false
          in: query
          name: state
          schema:
            description: deve bater com o state guardado no cookie
            type: string
        - description: preenchido quando o usuário recusa o consentimento
          explode: false
          in: query
          name: error
          schema:
            description: preenchido quando o usuário recusa o consentimento
            type: string
        - in: cookie
          name: forms_google_oauth
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Recebe o retorno do Google e emite o JWT
      tags:
        - auth
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Autentica e devolve um JWT
      tags:
        - auth
  /auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Dados do usuário autenticado
      tags:
        - auth
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cria uma conta de admin
      tags:
        - auth
  /config:
    get:
      description: "Não expõe segredo nenhum: só diz quais formas de login estão disponíveis."
      operationId: config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Configuração pública do servidor
      tags:
        - system
  /forms:
    get:
      operationId: listForms
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Lista os formulários do usuário
      tags:
        - forms
    post:
      operationId: createForm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Cria um formulário (nasce como draft)
      tags:
        - forms
  /forms/{formId}:
    delete:
      operationId: deleteForm
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Remove o formulário e suas respostas
      tags:
        - forms
    get:
      operationId: getForm
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Detalha um formulário com seus campos
      tags:
        - forms
    put:
      operationId: updateForm
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormUpdateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Atualiza título, descrição e campos
      tags:
        - forms
  /forms/{formId}/publish:
    post:
      operationId: publishForm
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Publica o formulário e gera a URL pública
      tags:
        - forms
  /forms/{formId}/responses:
    get:
      operationId: listResponses
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Lista as respostas recebidas por um formulário
      tags:
        - forms
  /forms/{formId}/unpublish:
    post:
      operationId: unpublishForm
      parameters:
        - in: path
          name: formId
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Volta o formulário para draft (desativa a URL pública)
      tags:
        - forms
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - system
  /public/forms/{slug}:
    get:
      operationId: getPublicForm
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            maxLength: 120
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Abre um formulário publicado (sem autenticação)
      tags:
        - public
  /public/forms/{slug}/responses:
    post:
      description: O backend valida os valores contra a definição do formulário antes de persistir.
      operationId: submitPublicForm
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            maxLength: 120
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Envia uma resposta (sem autenticação)
      tags:
        - public
